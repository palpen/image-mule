name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - name: Build, sign and notarize macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
        run: |
          : "${CSC_LINK:?Missing Developer ID certificate}" "${APPLE_ID:?Missing notary credentials}"
          npm run build -- --mac "--$ARCH" --publish never -c.forceCodeSigning=true -c.mac.notarize=true -c.dmg.sign=true
          bundle=$(find dist -maxdepth 2 -name 'Image Mule.app' -print -quit)
          codesign --verify --deep --strict "$bundle"
          xcrun stapler validate "$bundle"
          spctl --assess --type execute "$bundle"
      - name: Build and sign Windows
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (!$env:WIN_CSC_LINK) { throw 'Missing Windows signing certificate' }
          npm run build -- --win --x64 --publish never -c.forceCodeSigning=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem dist/*.exe) + @(Get-Item 'dist/win-unpacked/Image Mule.exe')
          foreach ($file in $files) {
            if ((Get-AuthenticodeSignature $file.FullName).Status -ne 'Valid') { throw "Invalid signature on $file" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish installers and checksums
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -- *.dmg *.exe > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes -- *.dmg *.exe SHA256SUMS
